version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.prod.conf:/etc/nginx/nginx.prod.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: .docker/api.Dockerfile

    env_file:
      - .env.production

    environment:
      - NODE_ENV=production

    depends_on:
      - redis
      - rabbitmq

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    restart: unless-stopped