version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
      - api3
      - web
    networks:
      - unihub-network

  api1:
    build:
      context: .
      dockerfile: .docker/api.Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - unihub-network

  api2:
    build:
      context: .
      dockerfile: .docker/api.Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - unihub-network

  api3:
    build:
      context: .
      dockerfile: .docker/api.Dockerfile
    environment:
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq
    networks:
      - unihub-network

  web:
    build:
      context: .
      dockerfile: .docker/web.Dockerfile
    networks:
      - unihub-network

  redis:
    image: redis:7-alpine
    networks:
      - unihub-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "15672:15672"
    networks:
      - unihub-network

networks:
  unihub-network:
    driver: bridge
